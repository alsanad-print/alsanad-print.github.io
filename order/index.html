<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تقديم طلب خدمة | السند للدعاية والإعلان</title>
<meta name="description" content="قدّم طلبك لدى السند للدعاية والإعلان في الموصل خطوةً بخطوة: الخدمة، والمقاس، والتنفيذ، والموعد، ثم أرسله مباشرةً عبر واتساب.">
<meta name="theme-color" content="#0B1B1F">
<meta property="og:type" content="website">
<meta property="og:locale" content="ar_IQ">
<meta property="og:site_name" content="السند للدعاية والإعلان">
<meta property="og:title" content="تقديم طلب خدمة | السند للدعاية والإعلان">
<meta property="og:description" content="خطوات واضحة، ومعاينة فورية لمشروعك، وإرسال مباشر عبر واتساب.">
<meta property="og:url" content="https://alsanad-print.github.io/order/">
<meta property="og:image" content="https://alsanad-print.github.io/assets/og.jpg">
<link rel="alternate" hreflang="ar" href="https://alsanad-print.github.io/order/">
<link rel="canonical" href="https://alsanad-print.github.io/order/">
<link rel="icon" href="../assets/favicon.png">
<link rel="apple-touch-icon" href="../assets/favicon.png">
<link rel="stylesheet" href="../css/fonts.css">
<style>
:root{
  --bg:#0B1B1F;--bg2:#0E2328;--card:rgba(15,34,39,.78);--card2:#13292F;
  --brand:#22967F;--brand-2:#146B5A;--brand-hi:#3CC4A4;--gold:#F5C64F;--gold-2:#E2A93A;
  --ink:#F2F6F5;--mut:#A9B6B5;--dim:#7F8E8D;--line:rgba(242,246,245,.10);--line2:rgba(60,196,164,.28);
  --r:18px;--ease:cubic-bezier(.2,.8,.2,1);
  --ar:'Baloo Bhaijaan 2','Montserrat',system-ui,sans-serif;--en:'Montserrat','Baloo Bhaijaan 2',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ar);line-height:1.65;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:linear-gradient(rgba(60,196,164,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(60,196,164,.05) 1px,transparent 1px);
  background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,#000 30%,transparent 80%);mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,#000 30%,transparent 80%)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--gold)}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.en{font-family:var(--en);direction:ltr;unicode-bidi:isolate}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:10px}

/* ---------- top ---------- */
.top{position:sticky;top:0;z-index:30;background:rgba(11,27,31,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .in{max-width:1180px;margin:auto;padding:12px clamp(16px,3vw,32px);display:flex;align-items:center;gap:16px}
.top img{height:38px;display:block}
.top nav{margin-inline-start:auto;display:flex;gap:8px}
.lnk{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 16px;border-radius:12px;border:1px solid var(--line2);background:rgba(15,34,39,.6);color:var(--ink);text-decoration:none;font-weight:700;font-size:15px;transition:border-color .2s,transform .2s}
.lnk:hover{border-color:var(--brand-hi);transform:translateY(-1px)}
.lnk svg{width:18px;height:18px}

/* ---------- hero ---------- */
.hero{max-width:1180px;margin:auto;padding:clamp(28px,5vw,56px) clamp(16px,3vw,32px) 8px;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end}
.kick{display:flex;align-items:center;gap:10px;font:700 12px var(--en);letter-spacing:.22em;color:var(--gold)}
.kick::before{content:"";width:28px;height:2px;background:var(--gold)}
.hero h1{margin:10px 0 6px;font-weight:800;font-size:clamp(34px,5.4vw,60px);line-height:1.08;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--brand-hi)}
.hero p{margin:0;color:var(--mut);font-size:clamp(15px,1.6vw,18px);max-width:640px;text-wrap:pretty}
.facts{display:flex;gap:10px;flex-wrap:wrap}
.fact{border:1px solid var(--line);border-radius:14px;padding:10px 14px;background:var(--card);min-width:116px}
.fact b{display:block;font:800 22px var(--en);color:var(--ink);line-height:1.1}
.fact span{font-size:13px;color:var(--mut)}

/* ---------- layout ---------- */
.wrap{max-width:1180px;margin:auto;padding:20px clamp(16px,3vw,32px) 120px;display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:22px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:24px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}

/* ---------- stepper ---------- */
.steps{display:flex;gap:6px;padding:18px 20px 0;list-style:none;margin:0}
.steps li{flex:1;min-width:0}
.steps button{width:100%;border:0;background:none;padding:0;text-align:start;color:var(--dim);display:flex;flex-direction:column;gap:8px}
.steps button:disabled{cursor:default}
.steps i{display:block;height:4px;border-radius:4px;background:var(--line);overflow:hidden;position:relative}
.steps i::after{content:"";position:absolute;inset:0;background:var(--brand-hi);transform:scaleX(0);transform-origin:right;transition:transform .5s var(--ease)}
.steps li.done i::after,.steps li.cur i::after{transform:scaleX(1)}
.steps li.cur i::after{background:var(--gold)}
.steps span{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps li.cur span{color:var(--ink)}
.steps li.done span{color:var(--mut)}

.stage{padding:22px clamp(18px,3vw,30px) 26px;min-height:440px}
.step{animation:in .5s var(--ease) both}
.step.back{animation-name:inb}
@keyframes in{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
@keyframes inb{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.step{animation:none}.steps i::after{transition:none}html{scroll-behavior:auto}}
.no{font:800 13px var(--en);color:var(--gold);letter-spacing:.12em}
.step h2{margin:4px 0 4px;font-size:clamp(24px,3vw,32px);font-weight:800;line-height:1.2}
.step .lead{margin:0 0 20px;color:var(--mut);font-size:15.5px}

/* service tiles */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:16px 14px 14px;border-radius:16px;border:1px solid var(--line);background:var(--card2);text-align:start;transition:border-color .25s,transform .25s var(--ease),background .25s;min-height:118px}
.tile:hover{border-color:var(--line2);transform:translateY(-2px)}
.tile .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(34,150,127,.16);color:var(--brand-hi);transition:background .25s,color .25s}
.tile b{font-size:15.5px;line-height:1.3}
.tile small{font-size:12.5px;color:var(--dim);line-height:1.35}
.tile .ck{position:absolute;top:12px;left:12px;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;transition:all .25s}
.tile .ck svg{width:13px;height:13px;stroke-width:3;opacity:0;transform:scale(.4);transition:all .25s var(--ease)}
.tile[aria-pressed="true"]{border-color:var(--brand-hi);background:linear-gradient(160deg,rgba(34,150,127,.24),rgba(19,41,47,.9))}
.tile[aria-pressed="true"] .ic{background:var(--brand);color:#fff}
.tile[aria-pressed="true"] .ck{background:var(--gold);border-color:var(--gold);color:#1B2A22}
.tile[aria-pressed="true"] .ck svg{opacity:1;transform:none}

/* fields */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.f{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.f>label,.f>.lb{font-size:14px;font-weight:700;color:var(--mut)}
.f .opt{font-weight:500;color:var(--dim);font-size:12.5px}
.in-x{width:100%;min-height:50px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(8,20,23,.65);transition:border-color .2s,box-shadow .2s;font-size:16px}
.in-x::placeholder{color:#6F7F7E}
.in-x:focus{outline:none;border-color:var(--brand-hi);box-shadow:0 0 0 4px rgba(60,196,164,.14)}
textarea.in-x{min-height:96px;resize:vertical;line-height:1.6}
select.in-x{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:18px 22px,24px 22px;background-size:6px 6px;background-repeat:no-repeat;padding-left:40px}
input[type=date].in-x{color-scheme:dark}
.hint{font-size:12.5px;color:var(--dim)}
.size{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.size .x{font:800 18px var(--en);color:var(--dim)}
.unit{position:relative}
.unit .in-x{padding-left:48px;font-family:var(--en);direction:ltr;text-align:right}
.unit em{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-style:normal;font-size:13px;color:var(--dim)}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card2);font-weight:700;font-size:14.5px;transition:all .22s var(--ease)}
.chip:hover{border-color:var(--line2)}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff;transform:translateY(-1px)}
.chip .sw{width:16px;height:16px;border-radius:50%;border:1.5px solid rgba(255,255,255,.5)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;padding:5px;border-radius:16px;background:rgba(8,20,23,.65);border:1px solid var(--line)}
.seg button{min-height:44px;border:0;border-radius:12px;background:none;font-weight:700;font-size:14.5px;color:var(--mut);transition:all .25s var(--ease)}
.seg button[aria-pressed="true"]{background:var(--card2);color:var(--ink);box-shadow:0 0 0 1px var(--line2),0 6px 18px -8px rgba(0,0,0,.7)}
.seg button[data-v="مستعجل"][aria-pressed="true"]{box-shadow:0 0 0 1px var(--gold)}
.seg button[data-v="طارئ"][aria-pressed="true"]{box-shadow:0 0 0 1px #E07A5F;color:#FFB4A2}
.pick{position:relative;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:8px 14px;border-radius:999px;border:1px dashed var(--line2);font-weight:700;font-size:14.5px;color:var(--mut)}
.pick input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:rgba(245,198,79,.08);border:1px solid rgba(245,198,79,.25);color:#E9DDB8;font-size:14px;margin:4px 0 14px}
.note svg{color:var(--gold);margin-top:2px}

/* review */
.rev{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:16px}
.rv{padding:12px 14px;border-radius:14px;background:var(--card2);border:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0}
.rv.w{grid-column:1/-1}
.rv small{color:var(--dim);font-size:12.5px;display:flex;justify-content:space-between;gap:8px}
.rv small button{border:0;background:none;color:var(--brand-hi);font-size:12.5px;font-weight:700;padding:0}
.rv b{font-size:15px;line-height:1.45;overflow-wrap:anywhere}
.send{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 22px;border-radius:14px;border:1px solid var(--line2);background:var(--card2);font-weight:800;font-size:16px;text-decoration:none;color:var(--ink);transition:transform .2s var(--ease),box-shadow .2s,border-color .2s,opacity .2s}
.btn:hover{transform:translateY(-1px);border-color:var(--brand-hi)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.38;cursor:not-allowed;transform:none}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold-2));color:#1B2A22;border-color:transparent;box-shadow:0 10px 30px -10px rgba(245,198,79,.6)}
.btn-gold:hover{border-color:transparent}
.btn-wa{background:#1F8F5F;color:#fff;border-color:transparent;box-shadow:0 10px 30px -12px rgba(31,143,95,.8)}
.btn-wa:hover{border-color:transparent}
.btn.grow{flex:1}

/* nav */
.nav{display:flex;align-items:center;gap:10px;padding:16px clamp(18px,3vw,30px);border-top:1px solid var(--line)}
.nav .meta{margin-inline-end:auto;font-size:13px;color:var(--dim)}
.nav .meta b{color:var(--mut)}
kbd{font:700 11px var(--en);border:1px solid var(--line2);border-radius:6px;padding:1px 6px;color:var(--mut)}

/* preview */
.side{position:sticky;top:86px;display:flex;flex-direction:column;gap:14px}
.pv{overflow:hidden}
.pv-h{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 0}
.pv-h b{font-size:15px}
.ring{display:flex;align-items:center;gap:10px;font:700 13px var(--en);color:var(--mut)}
.ring svg{width:44px;height:44px;transform:rotate(-90deg)}
.ring circle{stroke-width:4;fill:none}
.ring .t{stroke:var(--line)}
.ring .v{stroke:var(--gold);stroke-dasharray:113.1;transition:stroke-dashoffset .6s var(--ease)}
.scene{position:relative;margin:14px 18px 0;height:230px;border-radius:16px;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,#17343A 0%,#0A181B 70%);border:1px solid var(--line)}
.scene .wall{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.035),transparent 60%),repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 1px,transparent 1px 60px)}
.scene .floor{position:absolute;left:0;right:0;bottom:0;height:46px;background:linear-gradient(180deg,#0E2226,#081315);border-top:1px solid rgba(255,255,255,.06)}
.sign{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);display:grid;place-items:center;border-radius:6px;transition:width .6s var(--ease),height .6s var(--ease),background .5s,box-shadow .5s;overflow:hidden}
.sign .tx{font-weight:800;line-height:1;white-space:nowrap;text-align:center;padding:0 6%;transition:color .4s,text-shadow .4s,letter-spacing .4s}
.sign.lit{box-shadow:0 0 0 1px rgba(255,255,255,.18),0 18px 60px -10px var(--glowc,rgba(60,196,164,.55))}
.sign.lit .tx{text-shadow:0 0 18px rgba(255,255,255,.55)}
.sign.raised .tx{text-shadow:0 2px 0 rgba(0,0,0,.35),0 4px 0 rgba(0,0,0,.22),0 10px 16px rgba(0,0,0,.35)}
.sign .deco{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .5s}
.sign.st-typo .tx{letter-spacing:-.02em}
.sign.st-vector .deco.v{opacity:1}
.sign.st-surreal .deco.s{opacity:1}
.dim{position:absolute;direction:ltr;font:700 11px var(--en);color:var(--gold);display:flex;align-items:center;justify-content:center;gap:6px;transition:all .6s var(--ease)}
.dim.w::before,.dim.w::after{content:"";flex:1;height:1px;background:rgba(245,198,79,.55)}
.dim.h{flex-direction:column}
.dim.h::before,.dim.h::after{content:"";flex:1;width:1px;background:rgba(245,198,79,.55)}
.person{position:absolute;bottom:22px;width:12px;transition:all .6s var(--ease);opacity:.75}
.person i{display:block;width:12px;height:12px;border-radius:50%;background:#2B3E42;margin:0 auto 2px}
.person b{display:block;width:12px;border-radius:5px 5px 2px 2px;background:#2B3E42}
.scene .cap{position:absolute;right:12px;bottom:12px;font-size:11.5px;color:var(--dim)}
.pv-b{padding:14px 18px 18px}
.pv-b h3{margin:0;font-size:20px;font-weight:800;line-height:1.25;overflow-wrap:anywhere}
.pv-b .sv{margin:4px 0 12px;color:var(--mut);font-size:13.5px;min-height:22px}
.rows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.row{padding:10px 12px;border-radius:12px;background:rgba(8,20,23,.55);border:1px solid var(--line);min-width:0}
.row small{display:block;font-size:11.5px;color:var(--dim)}
.row b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row b.e{color:#6F7F7E;font-weight:500}
.help{padding:16px 18px;display:flex;gap:12px;align-items:center}
.help .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:rgba(31,143,95,.18);color:#5FD39C}
.help p{margin:0;font-size:13.5px;color:var(--mut);line-height:1.5}
.help a{font:700 14px var(--en);color:var(--ink);text-decoration:none;direction:ltr;unicode-bidi:isolate}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:#0F2A2E;border:1px solid var(--line2);padding:10px 18px;border-radius:12px;font-size:14px;font-weight:700;z-index:60;transition:all .35s var(--ease);pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

footer{border-top:1px solid var(--line);padding:26px clamp(16px,3vw,32px) calc(26px + env(safe-area-inset-bottom,0px));color:var(--mut);font-size:14px}
footer .in{max-width:1180px;margin:auto;display:flex;flex-wrap:wrap;gap:10px 26px;align-items:center;justify-content:space-between}
footer img{height:30px}
footer a{color:var(--mut);text-decoration:none}

/* ---------- responsive ---------- */
@media (max-width:980px){
  .wrap{grid-template-columns:1fr}
  .side{position:static;order:-1}
  .scene{height:180px}
  .help{display:none}
  .hero{grid-template-columns:1fr}
}
@media (max-width:640px){
  .top img{height:32px}
  .lnk span{display:none}
  .lnk{width:42px;padding:0;justify-content:center}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2,.rev{grid-template-columns:1fr}
  .steps span{display:none}
  .stage{min-height:0}
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(11,27,31,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
  .nav .meta{display:none}
  .nav .btn{flex:1}
  .facts{display:none}
  .pv-b .rows{display:none}
  .scene{height:150px}
  .pv-b{padding:10px 18px 14px}
  .pv-b h3{font-size:17px}
  .wrap{padding-bottom:110px}
}
</style>
<style>
/* language switch + LTR */
.lng{display:flex;gap:2px;padding:3px;border-radius:12px;border:1px solid var(--line2);background:rgba(15,34,39,.6)}
.lng button{border:0;background:none;min-width:38px;height:34px;border-radius:9px;font-weight:800;font-size:13px;color:var(--mut)}
.lng button[aria-pressed="true"]{background:var(--brand);color:#fff}
html[dir=ltr] body{font-family:var(--en)}
html[dir=ltr] .tile .ck{left:auto;right:12px}
html[dir=ltr] .unit .in-x{padding-left:14px;padding-right:48px;text-align:left}
html[dir=ltr] .unit em{left:auto;right:14px}
html[dir=ltr] select.in-x{background-position:calc(100% - 24px) 22px,calc(100% - 18px) 22px;padding-left:14px;padding-right:40px}
html[dir=ltr] .scene .cap{right:auto;left:12px}
html[dir=ltr] .steps i::after{transform-origin:left}
html[dir=ltr] .step{animation-name:inb}
html[dir=ltr] .step.back{animation-name:in}
html[lang=ckb] body{font-family:'Noto Kufi Arabic',var(--ar)}
html[lang=ckb] .hero h1{line-height:1.25}
.locs{display:flex;flex-wrap:wrap;gap:8px 18px}
.locs a{display:inline-flex;align-items:center;gap:6px;color:var(--mut);text-decoration:none;font-weight:700}
.locs a:hover{color:var(--ink)}
.locs svg{width:16px;height:16px;color:var(--brand-hi)}
@media (max-width:640px){.lng button{min-width:32px;height:32px}}
</style>
<script data-goatcounter="https://alsanadprint.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</head>
<body>
<header class="top">
  <div class="in">

  const c = [A.svc.length, A.name, A.kind, A.unknown || (A.w && A.h), A.inst, A.style || A.colsrc, A.date || A.urg, A.who, A.phone.replace(/\D/g, '').length >= 10];
  return Math.round(c.filter(Boolean).length / c.length * 100);
}

/* ---------------------------------------------------------------- preview */
const lum = hex => { const n = parseInt(hex.slice(1), 16); const c = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }); return .2126 * c[0] + .7152 * c[1] + .0722 * c[2]; };
function preview() {
  const sign = $('#sign'), scene = sign.parentElement;
  const SW = scene.clientWidth, SH = scene.clientHeight - 46;
  let w = parseFloat(A.w), h = parseFloat(A.h);
  const known = !A.unknown && w > 0 && h > 0;
  if (!known) { w = 400; h = 100; }
  const ratio = Math.min(Math.max(w / h, .3), 9);
  let pw = SW * .78, ph = pw / ratio;
  if (ph > SH * .72) { ph = SH * .72; pw = ph * ratio; }
  sign.style.width = pw + 'px'; sign.style.height = ph + 'px';
  const bg = /^#[0-9a-f]{6}$/i.test(A.color) ? A.color : '#22967F';
  const light = lum(bg) > .45;
  sign.style.background = `linear-gradient(160deg, ${bg}, color-mix(in srgb, ${bg} 72%, #000))`;
  sign.style.setProperty('--glowc', bg + '99');
  const tx = $('#signTx'), name = A.name.trim() || t('pvName');
  tx.textContent = name;
  tx.style.color = light ? '#0D1F24' : (has('letters') ? '#F5C64F' : '#FFFFFF');
  tx.style.fontSize = Math.max(11, Math.min(ph * .46, pw * 1.5 / Math.max(name.length, 3))) + 'px';
  const sk = (STYLES.find(s => s.v === A.style) || {}).k || '';
  sign.className = 'sign' + (has('letters', 'box') ? ' lit' : '') + (has('letters') ? ' raised' : '') + (sk ? ' st-' + sk : '');
  const cx = SW / 2, cy = scene.clientHeight * .48;
  const dw = $('#dimW'), dh = $('#dimH');
  dw.style.width = pw + 'px'; dw.style.left = (cx - pw / 2) + 'px'; dw.style.top = (cy + ph / 2 + 6) + 'px';
  dw.textContent = known ? `${w} cm` : '— cm';
  dh.style.height = ph + 'px'; dh.style.left = (cx + pw / 2 + 8) + 'px'; dh.style.top = (cy - ph / 2) + 'px';
  dh.innerHTML = `<span style="writing-mode:vertical-rl">${known ? h + ' cm' : '— cm'}</span>`;
  const p = $('#person');
  if (known) {
    let hp = 170 / (h / ph);
    const vis = hp >= 14 && hp <= SH * 1.1;
    p.style.opacity = vis ? .8 : 0;
    hp = Math.min(Math.max(hp, 14), SH); p.querySelector('b').style.height = Math.max(hp - 14, 4) + 'px';
    p.style.left = (cx - pw / 2 - 26) + 'px';
    $('#cap').textContent = vis ? t('human') : t('cap');
  } else { p.style.opacity = 0; $('#cap').textContent = t('cap'); }
  $('#pvName').textContent = A.name.trim() || t('pvName');
  $('#pvSvc').textContent = A.svc.length ? svcNames().join(' · ') : t('pvSvc');
  const pr = [[t('rSize'), sizeTxt()], [t('rInst'), L(A.inst)], [t('rStyle'), L(A.style)], [t('rDate'), A.date || L(A.urg)]];
  $('#pvRows').innerHTML = pr.map(([k, v]) => `<div class="row"><small>${k}</small><b class="${v ? '' : 'e'}">${esc(v || '—')}</b></div>`).join('');
  const r = readiness();
  $('#pct').textContent = r + '%';
  $('#ringv').style.strokeDashoffset = 113.1 * (1 - r / 100);
}

/* ---------------------------------------------------------------- render */
function stepper() {
  $('#steps').innerHTML = t('steps').map((s, i) => {
    const reach = i <= st || [...Array(i).keys()].every(j => valid(j));
    return `<li class="${i < st ? 'done' : i === st ? 'cur' : ''}"><button type="button" data-go="${i}" ${reach ? '' : 'disabled'} aria-current="${i === st ? 'step' : 'false'}" aria-label="${esc(t('stepAria')(i + 1, s))}"><i></i><span>${s}</span></button></li>`;
  }).join('');
}
function navState() {
  $('#back').disabled = st === 0;
  const nx = $('#next');
  nx.style.display = st === NSTEPS - 1 ? 'none' : '';
  nx.disabled = !valid();
  $('#meta').innerHTML = !valid() && need() ? need() : t('enterHint');
  const s = $('#sendWa');
  if (s) { const ok = valid(5); s.setAttribute('aria-disabled', ok ? 'false' : 'true'); s.style.opacity = ok ? '' : '.4'; s.style.pointerEvents = ok ? '' : 'none'; s.href = waLink(); }
}
function render(focus = true) {
  const stage = $('#stage');
  stage.innerHTML = `<div class="step ${dir < 0 ? 'back' : ''}">${stepHtml()}</div>`;
  stepper(); navState(); preview(); save();
  if (focus) { const h = stage.querySelector('h2'); if (h) { h.tabIndex = -1; h.focus({ preventScroll: true }); } }
}
function applyLang() {
  const L0 = LANGS[lang];
  document.documentElement.lang = L0.html; document.documentElement.dir = L0.dir;
  document.title = t('title');
  document.querySelectorAll('[data-i]').forEach(el => { el.textContent = t(el.dataset.i); });
  document.querySelectorAll('[data-i-aria]').forEach(el => el.setAttribute('aria-label', t(el.dataset.iAria)));
  document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang ? 'true' : 'false'));
  document.querySelectorAll('svg.fl').forEach(s => s.style.transform = L0.dir === 'ltr' ? 'scaleX(-1)' : '');
}
function go(i) {
  if (i < 0 || i >= NSTEPS || i === st) return;
  if (i > st) { for (let j = st; j < i; j++) if (!valid(j)) { toast(need()); return; } }
  dir = i > st ? 1 : -1; st = i; render();
  const top = $('.panel').getBoundingClientRect().top + scrollY - 90;
  if (Math.abs(scrollY - top) > 60) scrollTo({ top, behavior: 'smooth' });
}
let tt;
function toast(m) { const el = $('#toast'); el.textContent = m; el.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('on'), 2200); }

/* ---------------------------------------------------------------- events */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-svc],[data-k],[data-go],[data-act],[data-toggle],[data-lang],#next,#back');
  if (!el || el.disabled) return;
  if (el.dataset.lang) { if (el.dataset.lang !== lang) { lang = el.dataset.lang; try { localStorage.setItem('alsanad-lang', lang); } catch (x) {} location.reload(); } return; }
  if (el.id === 'next') { if (valid()) go(st + 1); else toast(need()); return; }
  if (el.id === 'back') { go(st - 1); return; }
  const d = el.dataset;
  if (d.svc) {
    const i = A.svc.indexOf(d.svc); i < 0 ? A.svc.push(d.svc) : A.svc.splice(i, 1);
    el.setAttribute('aria-pressed', i < 0 ? 'true' : 'false'); stepper(); navState(); preview(); save(); return;
  }
  if (d.k) {
    A[d.k] = A[d.k] === d.v ? '' : d.v;
    el.parentElement.querySelectorAll('[data-k]').forEach(b => b.setAttribute('aria-pressed', A[d.k] === b.dataset.v ? 'true' : 'false'));
    stepper(); navState(); preview(); save(); return;
  }
  if (d.toggle === 'unknown') { A.unknown = !A.unknown; render(false); return; }
  if (d.go !== undefined) { go(+d.go); return; }
  if (d.act === 'copy') {
    const txt = message();
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast(t('copied')), () => {
      const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); toast(t('copied')); } catch (x) { toast(t('copyFail')); } ta.remove();
    });
    return;
  }
  if (d.act === 'reset') {
    if (!confirm(t('confirmReset'))) return;
    A = blank(); dir = -1; st = 0; try { localStorage.removeItem(KEY); } catch (x) {} render(); return;
  }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.color !== undefined) { A.color = el.value; const sw = el.parentElement.querySelector('.sw'); if (sw) sw.style.background = el.value; el.closest('.chips').querySelectorAll('[data-k=color]').forEach(b => b.setAttribute('aria-pressed', 'false')); preview(); navState(); save(); return; }
  const k = el.dataset.f; if (!k) return;
  let v = el.value;
  const digits = s => s.replace(/[٠-٩]/g, c => '٠١٢٣٤٥٦٧٨٩'.indexOf(c)).replace(/[۰-۹]/g, c => '۰۱۲۳۴۵۶۷۸۹'.indexOf(c));
  if (k === 'w' || k === 'h') { v = digits(v).replace(/[^\d.]/g, ''); if (v !== el.value) el.value = v; }
  if (k === 'phone') v = digits(v);
  A[k] = v;
  stepper(); navState(); preview(); save();
});
document.addEventListener('change', e => { if (e.target.dataset.f === 'gov') { A.gov = e.target.value; preview(); save(); } });
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.isComposing) return;
  const el = e.target; if (el.tagName === 'TEXTAREA' || el.tagName === 'BUTTON' || el.tagName === 'A') return;
  if (st < NSTEPS - 1) { e.preventDefault(); if (valid()) go(st + 1); else toast(need()); }
});
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(preview, 80); });
document.fonts?.ready?.then(preview);

applyLang();
render(false);
})();
</script>
</body>
