<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أعمالنا | السند للدعاية والإعلان</title>
<meta name="description" content="أعمال السند للدعاية والإعلان: واجهات، حروف بارزة، ستاندات، مطبوعات وهويات بصرية صمّمناها ونفّذناها لعملائنا في الموصل وجميع محافظات العراق.">
<meta name="theme-color" content="#0B1B1F">
<meta property="og:type" content="website">
<meta property="og:locale" content="ar_IQ">
<meta property="og:site_name" content="السند للدعاية والإعلان">
<meta property="og:title" content="أعمالنا | السند للدعاية والإعلان">
<meta property="og:description" content="مشاريع صمّمناها ونفّذناها لعملائنا — من الفكرة إلى التركيب.">
<meta property="og:url" content="https://alsanad-print.github.io/projects/">
<meta property="og:image" content="https://alsanad-print.github.io/assets/og.jpg">
<link rel="canonical" href="https://alsanad-print.github.io/projects/">
<link rel="icon" href="../assets/favicon.png">
<link rel="apple-touch-icon" href="../assets/favicon.png">

<style>
:root{
  --bg:#0B1B1F;--bg2:#0E2328;--card:#10262B;--card2:#13292F;
  --brand:#22967F;--brand-2:#146B5A;--brand-hi:#3CC4A4;--gold:#F5C64F;
  --ink:#F2F6F5;--mut:#A9B6B5;--dim:#7F8E8D;--line:rgba(242,246,245,.09);--line2:rgba(60,196,164,.3);
  --ease:cubic-bezier(.2,.8,.2,1);--pad:clamp(16px,5vw,72px);
  --ar:'Baloo Bhaijaan 2','Montserrat',system-ui,sans-serif;--en:'Montserrat','Baloo Bhaijaan 2',system-ui,sans-serif;--ku:'Noto Kufi Arabic',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--ar);line-height:1.6;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;min-height:100vh}
html[lang=en] body{font-family:var(--en)}
html[lang=ckb] body{font-family:var(--ku)}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(rgba(60,196,164,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(60,196,164,.045) 1px,transparent 1px);background-size:48px 48px;-webkit-mask-image:radial-gradient(ellipse 90% 55% at 50% 0%,#000 25%,transparent 80%);mask-image:radial-gradient(ellipse 90% 55% at 50% 0%,#000 25%,transparent 80%)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.en{font-family:var(--en);direction:ltr;unicode-bidi:isolate}
[hidden]{display:none!important}

/* top */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:20px;justify-content:space-between;padding:14px var(--pad);background:rgba(11,27,31,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .logo img{height:34px}
.nav{display:flex;gap:4px;align-items:center}
.nav a,.nav button{padding:9px 14px;border-radius:10px;font-weight:700;font-size:14.5px;color:var(--mut);transition:.2s}
.nav a:hover{color:var(--ink);background:rgba(255,255,255,.04)}
.nav a.on{color:var(--ink)}
.nav .cta{background:var(--gold);color:#1B2A22}
.langs{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-inline-start:6px}
.langs button{padding:8px 11px;font-family:var(--en);font-weight:700;font-size:12.5px;color:var(--dim)}
.langs button[data-l=ku]{font-family:var(--ku);font-size:12px}
.langs button.on{background:var(--brand);color:#fff}

/* hero */
.hero{padding:clamp(56px,9vw,110px) var(--pad) 36px;display:grid;grid-template-columns:1.4fr 1fr;gap:40px;align-items:end}
.kick{font-style:normal;font-family:var(--en);font-weight:800;font-size:11.5px;letter-spacing:.24em;color:var(--gold)}
.hero h1{font-size:clamp(40px,6.4vw,84px);line-height:1.05;margin:14px 0 18px;font-weight:800;letter-spacing:-.01em}
html[lang=ckb] .hero h1{font-size:clamp(34px,5.4vw,70px);line-height:1.25}
.hero p{color:var(--mut);font-size:clamp(16px,1.5vw,18.5px);max-width:620px;line-height:1.8}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:18px;overflow:hidden;background:rgba(16,38,43,.55)}
.stat{padding:22px 20px;border-inline-start:1px solid var(--line)}
.stat:first-child{border-inline-start:0}
.stat b{display:block;font-family:var(--en);font-size:clamp(30px,3.4vw,44px);font-weight:800;line-height:1;color:var(--ink)}
.stat span{display:block;margin-top:8px;font-size:13px;color:var(--mut)}

/* toolbar */
.bar{position:sticky;top:63px;z-index:20;padding:12px var(--pad);display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:linear-gradient(var(--bg) 70%,rgba(11,27,31,0));}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
.chips::-webkit-scrollbar{display:none}
.chip{height:38px;padding:0 15px;border-radius:30px;border:1px solid var(--line);font-size:14px;font-weight:700;color:var(--mut);white-space:nowrap;transition:.2s}
.chip:hover{color:var(--ink);border-color:rgba(255,255,255,.2)}
.chip.on{background:var(--ink);color:var(--bg);border-color:transparent}
.seg{display:flex;padding:3px;border:1px solid var(--line);border-radius:12px;background:rgba(16,38,43,.6)}
.seg button{height:32px;padding:0 13px;border-radius:9px;font-size:13.5px;font-weight:700;color:var(--mut);white-space:nowrap}
.seg button.on{background:var(--brand);color:#fff}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* client blocks */
main{padding:8px var(--pad) 40px}
.cb{display:grid;grid-template-columns:260px 1fr;gap:28px;padding:34px 0;border-top:1px solid var(--line)}
.cb:first-child{border-top:0}
.cb-h{position:sticky;top:130px;align-self:start;display:flex;flex-direction:column;gap:14px}
.logo-tile{width:84px;height:84px;border-radius:18px;background:linear-gradient(150deg,#16363B,#0D2226);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden}
.logo-tile img{max-width:70%;max-height:62%;object-fit:contain;filter:brightness(0) invert(1);opacity:.92}
.logo-tile .ini{font-family:var(--en);font-weight:800;font-size:26px;color:var(--brand-hi)}
.cb-h h2{font-size:24px;line-height:1.3}
.cb-h small{display:block;color:var(--mut);font-size:14px}
.cb-h .cnt{font-family:var(--en);font-size:12.5px;color:var(--gold);letter-spacing:.06em}
.more{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:14px;color:var(--brand-hi)}
.more:hover{color:var(--ink)}
html[dir=rtl] .more svg{transform:scaleX(-1)}
.row{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(270px,34%);gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.15) transparent}
.row>*{scroll-snap-align:start}

/* project card */
.pc{position:relative;display:flex;flex-direction:column;border-radius:18px;overflow:hidden;background:var(--card);border:1px solid var(--line);transition:transform .4s var(--ease),border-color .3s}
.pc:hover{transform:translateY(-4px);border-color:var(--line2)}
.pc .ph{position:relative;aspect-ratio:4/3;overflow:hidden;background:#0A1A1D}
.pc .ph img{width:100%;height:100%;object-fit:cover;transition:transform .8s var(--ease)}
.pc:hover .ph img{transform:scale(1.045)}
.pc .badges{position:absolute;top:12px;inset-inline-start:12px;display:flex;gap:6px}
.bd{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:7px;font-size:12px;font-weight:700;background:rgba(8,20,22,.82);backdrop-filter:blur(6px)}
.bd.build{color:#fff;background:rgba(34,150,127,.92)}
.bd.design{color:var(--gold);border:1px solid rgba(245,198,79,.5)}
.bd svg{width:13px;height:13px}
.pc .body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px}
.pc .cl{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mut)}
.pc .cl .mini{width:22px;height:22px;border-radius:6px;background:#16363B;display:grid;place-items:center;overflow:hidden}
.pc .cl .mini img{max-width:76%;max-height:76%;filter:brightness(0) invert(1)}
.pc .cl .mini i{font-style:normal;font-family:var(--en);font-size:10px;font-weight:800;color:var(--brand-hi)}
.pc h3{font-size:18px;line-height:1.35}
.pc .meta{font-size:13px;color:var(--dim)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px;padding-top:12px}
.empty{padding:80px 20px;text-align:center;color:var(--mut);font-size:17px}

/* client page */
.cp-head{display:grid;grid-template-columns:auto 1fr auto;gap:26px;align-items:center;padding:clamp(40px,6vw,70px) var(--pad) 30px}
.cp-head .logo-tile{width:120px;height:120px;border-radius:24px}
.cp-head h1{font-size:clamp(32px,4.6vw,56px);line-height:1.15;margin:8px 0 6px}
.cp-head p{color:var(--mut)}
.back{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;color:var(--mut);margin:20px var(--pad) 0}
.back:hover{color:var(--ink)}
html[dir=ltr] .back svg{transform:scaleX(-1)}
.cp-stats{display:flex;gap:10px}
.cp-stats div{padding:14px 18px;border-radius:14px;border:1px solid var(--line);text-align:center;min-width:96px}
.cp-stats b{display:block;font-family:var(--en);font-size:26px;font-weight:800;line-height:1.1}
.cp-stats span{font-size:12.5px;color:var(--mut)}

/* CTA */
.cta-band{margin:30px var(--pad) 0;padding:clamp(28px,4vw,48px);border-radius:24px;background:linear-gradient(135deg,#145A4D,#0E2D2B 60%);border:1px solid var(--line2);display:flex;gap:24px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.cta-band h2{font-size:clamp(24px,3vw,34px)}
.cta-band p{color:#CFE2DE;margin-top:6px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 20px;border-radius:12px;font-weight:700;font-size:15px;border:1px solid var(--line);background:rgba(255,255,255,.04);white-space:nowrap;transition:.2s}
.btn:hover{border-color:rgba(255,255,255,.25)}
.btn-gold{background:var(--gold);color:#1B2A22;border-color:transparent}
.btn-wa{background:#1F8F5F;color:#fff;border-color:transparent}
footer{padding:34px var(--pad);margin-top:50px;border-top:1px solid var(--line);color:var(--dim);font-size:13.5px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
footer a{color:var(--mut)}

/* viewer */
.vw{position:fixed;inset:0;z-index:60;background:rgba(5,13,15,.97);display:grid;grid-template-columns:minmax(0,1.65fr) minmax(320px,1fr);opacity:0;pointer-events:none;transition:opacity .35s}
.vw.open{opacity:1;pointer-events:auto}
.stage{position:relative;display:flex;flex-direction:column;min-height:0;padding:20px;gap:14px}
.media{position:relative;flex:1;min-height:0;border-radius:16px;overflow:hidden;background:#071214;display:grid;place-items:center}
.media>img,.media>video{width:100%;height:100%;object-fit:contain}
.nav-arrow{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(8,20,22,.75);display:grid;place-items:center;z-index:3}
.nav-arrow.prev{inset-inline-start:14px}.nav-arrow.next{inset-inline-end:14px}
html[dir=rtl] .nav-arrow svg{transform:scaleX(-1)}
.thumbs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.thumbs button{flex:none;width:86px;height:64px;border-radius:10px;overflow:hidden;border:2px solid transparent;opacity:.55;transition:.2s;position:relative;background:#0A1A1D}
.thumbs button img{width:100%;height:100%;object-fit:cover}
.thumbs button.on{border-color:var(--gold);opacity:1}
.thumbs button span{position:absolute;inset:auto 0 0;font-size:10.5px;font-weight:700;background:rgba(8,20,22,.8);padding:2px}
.info{border-inline-start:1px solid var(--line);padding:26px 28px;overflow:auto;display:flex;flex-direction:column;gap:18px;background:#0B1B1F}
.info-top{display:flex;justify-content:space-between;align-items:center}
.x{width:40px;height:40px;border-radius:11px;background:rgba(255,255,255,.06);font-size:24px;line-height:1}
.x:hover{background:rgba(255,255,255,.12)}
.vcl{display:flex;align-items:center;gap:14px;padding:14px;border-radius:14px;border:1px solid var(--line);transition:.2s}
.vcl:hover{border-color:var(--line2)}
.vcl .logo-tile{width:56px;height:56px;border-radius:13px}
.vcl small{display:block;font-size:12px;color:var(--dim)}
.vcl b{font-size:16.5px}
.info h2{font-size:clamp(26px,2.4vw,34px);line-height:1.25}
.facts{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.facts div{padding:13px 15px;border-top:1px solid var(--line)}
.facts div:nth-child(-n+2){border-top:0}
.facts div:nth-child(even){border-inline-start:1px solid var(--line)}
.facts small{display:block;font-size:12px;color:var(--dim)}
.facts b{font-size:14.5px}
.desc{color:#CFDAD8;line-height:1.85;font-size:15.5px}
.pn{display:flex;gap:8px;margin-top:auto;padding-top:6px}
.pn .btn{flex:1;height:42px;font-size:14px}

/* compare */
.cmp{position:relative;width:100%;height:100%;--p:50%;user-select:none;touch-action:pan-y}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.cmp .b{position:absolute;inset:0;clip-path:inset(0 calc(100% - var(--p)) 0 0)}
.cmp::after{content:"";position:absolute;top:0;bottom:0;left:var(--p);width:2px;background:var(--gold);box-shadow:0 0 14px rgba(245,198,79,.8);pointer-events:none}
.cmp .knob{position:absolute;top:50%;left:var(--p);width:42px;height:42px;margin:-21px;border-radius:50%;background:var(--gold);color:#1B2A22;display:grid;place-items:center;pointer-events:none;z-index:2;font-family:var(--en);font-weight:800;font-size:13px}
.cmp input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0;direction:ltr;z-index:3}
.cmp .l,.cmp .r{position:absolute;top:14px;padding:5px 12px;border-radius:7px;background:rgba(8,20,22,.82);font-size:13px;font-weight:700;pointer-events:none;z-index:2}
.cmp .l{left:14px}.cmp .r{right:14px;color:var(--gold)}
.vx{position:absolute;top:12px;inset-inline-end:12px;z-index:4;background:rgba(8,20,22,.8);display:none}
@media (max-width:980px){.vx{display:block}.info .x{display:none}}
.toast{position:fixed;bottom:24px;inset-inline:0;margin:auto;width:max-content;z-index:80;padding:11px 18px;border-radius:10px;background:#16393C;border:1px solid var(--line2);font-size:14px;transform:translateY(20px);opacity:0;transition:.3s;pointer-events:none}
.toast.on{transform:none;opacity:1}

.fade-in{animation:fi .6s var(--ease) both}
@keyframes fi{from{opacity:0;transform:translateY(14px)}}

@media (max-width:980px){
  .hero{grid-template-columns:1fr;gap:28px}
  .cb{grid-template-columns:1fr;gap:16px}
  .cb-h{position:static;flex-direction:row;align-items:center;flex-wrap:wrap}
  .cb-h .logo-tile{width:64px;height:64px;border-radius:15px}
  .cb-h .txt{flex:1;min-width:0}
  .row{grid-auto-columns:78%}
  .vw{grid-template-columns:1fr;grid-template-rows:minmax(0,56vh) 1fr;overflow:auto}
  .info{border-inline-start:0;border-top:1px solid var(--line)}
  .stage{padding:12px}
  .cp-head{grid-template-columns:auto 1fr;}
  .cp-stats{grid-column:1/-1}
}
@media (max-width:640px){
  .nav a:not(.cta){display:none}
  .top .logo img{height:28px}
  .bar{top:57px}
  .stat{padding:16px 14px}
  .grid{grid-template-columns:1fr}
  .cp-head .logo-tile{width:84px;height:84px}
  .thumbs button{width:70px;height:52px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<script data-goatcounter="https://alsanadprint.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>

    stClients: 'Clients & partners', stProjects: 'Delivered projects', stDesigns: 'Designs', all: 'All categories', kindAll: 'All', build: 'Design & build', design: 'Design', vClients: 'By client', vGrid: 'All projects',
    clientPage: 'Client page', back: 'All work', client: 'Client', category: 'Category', type: 'Scope', loc: 'Location', year: 'Year', similar: 'Request a similar project', share: 'Copy project link', copied: 'Project link copied',
    prev: 'Previous project', next: 'Next project', before: 'Before', after: 'After', video: 'Video', empty: 'We are adding our projects. Stay tuned.', noMatch: 'No projects match this selection.', close: 'Close',
    ctaT: 'Have a project in mind?', ctaS: 'From concept to installation, the Al-Sanad team is with you at every stage.', ctaB: 'Place a service order', wa: 'WhatsApp us', rights: 'All rights reserved', brand: 'Al-Sanad Advertising',
    projects: n => `${n} project${n === 1 ? '' : 's'}`, msg: 'Hello, I would like a project similar to: ' },
  ku: { navHome: 'سەرەکی', navProjects: 'کارەکانمان', navOrder: 'داواکاری نوێ', h1: 'کارەکانمان', sub: 'هەڵبژاردەیەک لەو پڕۆژانەی بۆ کڕیار و هاوبەشەکانمان لە موسڵ و هەموو پارێزگاکانی عێراق دیزاین و جێبەجێمان کردوون.',
    stClients: 'کڕیار و هاوبەش', stProjects: 'پڕۆژەی جێبەجێکراو', stDesigns: 'دیزاین', all: 'هەموو پۆلەکان', kindAll: 'هەموو', build: 'دیزاین و جێبەجێکردن', design: 'دیزاین', vClients: 'بەپێی کڕیار', vGrid: 'هەموو پڕۆژەکان',
    clientPage: 'پەڕەی کڕیار', back: 'هەموو کارەکان', client: 'کڕیار', category: 'پۆل', type: 'جۆری کار', loc: 'شوێن', year: 'ساڵ', similar: 'داوای کارێکی هاوشێوە بکە', share: 'کۆپیکردنی بەستەری پڕۆژە', copied: 'بەستەری پڕۆژە کۆپی کرا',
    prev: 'پڕۆژەی پێشوو', next: 'پڕۆژەی دواتر', before: 'پێش', after: 'دوای', video: 'ڤیدیۆ', empty: 'خەریکی زیادکردنی کارەکانمانین. بەم زووانە.', noMatch: 'هیچ کارێک بەم هەڵبژاردنە نییە.', close: 'داخستن',
    ctaT: 'پڕۆژەیەکت هەیە؟', ctaS: 'لە بیرۆکەوە تا دامەزراندن، تیمی سەنەد لە هەموو قۆناغێکدا لەگەڵتە.', ctaB: 'پێشکەشکردنی داواکاری', wa: 'پەیوەندی لە واتسئاپ', rights: 'هەموو مافەکان پارێزراون', brand: 'سەنەد بۆ ڕیکلام و ڕاگەیاندن',
    projects: n => `${n} پڕۆژە`, msg: 'سڵاو، دەمەوێت کارێکی هاوشێوەی ئەم پڕۆژەیە: ' },
};
const I = {
  arrow: '<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  back: '<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  play: '<svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>',
  ba: '<svg viewBox="0 0 24 24"><path d="M12 3v18M8 8l-4 4 4 4M16 8l4 4-4 4"/></svg>',
  wa: '<svg viewBox="0 0 24 24"><path d="M3 21l1.7-5A8.5 8.5 0 1 1 8 19.3z"/></svg>',
  link: '<svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>',
  pin: '<svg viewBox="0 0 24 24"><path d="M12 21s7-6.3 7-11.5A7 7 0 0 0 5 9.5C5 14.7 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const R = p => p && !/^(https?:|data:|\/)/.test(p) ? '../' + p : p; // asset paths are stored relative to site root

let lang = 'ar'; try { const l = localStorage.getItem('alsanad-lang'); if (LANGS.some(x => x.id === l)) lang = l; } catch (e) {}
let D = { categories: CATEGORIES, clients: [], works: [] };
const S = { cat: 'all', kind: 'all', view: 'clients' };
const t = k => T[lang][k];

/* ---------------- data helpers ---------------- */
const works = () => D.works.filter(w => !w.sample);
const clientOf = w => D.clients.find(c => c.id === w.client);
const cName = c => c ? (c['name_' + lang] || c.name_ar || c.name || '') : '';
const kindOf = w => w.kind === 'design' ? 'design' : 'build';
const catsOf = w => w.cats?.length ? w.cats : (w.cat ? [w.cat] : []);
const catNames = w => catsOf(w).map(catName).filter(Boolean).join('، ');
const catName = id => { const c = D.categories.find(x => x.id === id); return c ? pick(c, lang) : ''; };
const media = w => {
  const m = [];
  if (w.video) m.push({ type: 'video', src: R(w.video), poster: R(w.img) });
  if (w.before) m.push({ type: 'compare', src: R(w.img), before: R(w.before) });
  m.push({ type: 'img', src: R(w.img) });
  (w.images || []).forEach(s => m.push({ type: 'img', src: R(s) }));
  return m;
};
function filtered() {
  return works().filter(w => (S.cat === 'all' || catsOf(w).includes(S.cat)) && (S.kind === 'all' || kindOf(w) === S.kind));
}
function logoTile(c, cls = 'logo-tile') {
  if (c?.logo) return `<span class="${cls}"><img src="${esc(R(c.logo))}" alt="${esc(cName(c))}" loading="lazy"></span>`;
  const ini = (c?.name_en || cName(c) || '·').trim().slice(0, 2).toUpperCase();
  return `<span class="${cls}"><span class="ini">${esc(ini)}</span></span>`;
}
function miniLogo(c) {
  if (c?.logo) return `<span class="mini"><img src="${esc(R(c.logo))}" alt=""></span>`;
  return `<span class="mini"><i>${esc((c?.name_en || cName(c) || '·').slice(0, 1).toUpperCase())}</i></span>`;
}
function card(w) {
  const c = clientOf(w), k = kindOf(w);
  return `<a class="pc fade-in" href="#p-${esc(w.id)}">
    <div class="ph"><img src="${esc(R(w.img))}" alt="${esc(field(w, 'title', lang))}" loading="lazy">
      <div class="badges"><span class="bd ${k}">${t(k)}</span>${w.before ? `<span class="bd">${I.ba}${t('before')}/${t('after')}</span>` : ''}${w.video ? `<span class="bd">${I.play}${t('video')}</span>` : ''}</div></div>
    <div class="body">${c ? `<div class="cl">${miniLogo(c)}<span>${esc(cName(c))}</span></div>` : ''}
      <h3>${esc(field(w, 'title', lang))}</h3>
      <div class="meta">${esc(catNames(w))}${field(w, 'area', lang) ? ' · ' + esc(field(w, 'area', lang)) : ''}</div></div></a>`;
}

/* ---------------- render ---------------- */
function renderStatic() {
  const L = LANGS.find(x => x.id === lang);
  document.documentElement.lang = L.html; document.documentElement.dir = L.dir;
  document.querySelectorAll('[data-t]').forEach(el => el.textContent = t(el.dataset.t));
  $('#langs').innerHTML = LANGS.map(l => `<button data-l="${l.id}" class="${l.id === lang ? 'on' : ''}">${l.short}</button>`).join('');
  const W = works(), cl = new Set(W.map(w => w.client).filter(Boolean));
  $('#stats').innerHTML = [[cl.size, t('stClients')], [W.filter(w => kindOf(w) === 'build').length, t('stProjects')], [W.filter(w => kindOf(w) === 'design').length, t('stDesigns')]]
    .filter(([n], i) => n > 0 || i === 0).map(([n, l]) => `<div class="stat"><b>${n}</b><span>${l}</span></div>`).join('');
  $('#stats').style.gridTemplateColumns = `repeat(${$('#stats').children.length},1fr)`;
  const usedCats = D.categories.filter(c => W.some(w => catsOf(w).includes(c.id)));
  $('#cats').innerHTML = `<button class="chip ${S.cat === 'all' ? 'on' : ''}" data-cat="all">${t('all')}</button>` + usedCats.map(c => `<button class="chip ${S.cat === c.id ? 'on' : ''}" data-cat="${esc(c.id)}">${esc(pick(c, lang))}</button>`).join('');
  $('#kinds').innerHTML = ['all', 'build', 'design'].map(k => `<button data-kind="${k}" class="${S.kind === k ? 'on' : ''}">${t(k === 'all' ? 'kindAll' : k)}</button>`).join('');
  $('#views').innerHTML = [['clients', 'vClients'], ['grid', 'vGrid']].map(([v, k]) => `<button data-view="${v}" class="${S.view === v ? 'on' : ''}">${t(k)}</button>`).join('');
  let btns = `<a class="btn btn-gold" href="../order/">${t('ctaB')}</a>`;
  if (CONFIG.whatsapp) btns += `<a class="btn btn-wa" href="https://wa.me/${CONFIG.whatsapp}" target="_blank" rel="noopener">${I.wa}${t('wa')}</a>`;
  $('#ctaBtns').innerHTML = btns;
  $('#foot').textContent = `© ${new Date().getFullYear()} ${t('brand')} — ${t('rights')}`;
}
function renderList() {
  const list = filtered(), el = $('#list');
  if (!works().length) { el.innerHTML = `<div class="empty">${t('empty')}</div>`; return; }
  if (!list.length) { el.innerHTML = `<div class="empty">${t('noMatch')}</div>`; return; }
  if (S.view === 'grid') { el.innerHTML = `<div class="grid">${list.map(card).join('')}</div>`; return; }
  const groups = [];
  for (const c of D.clients) { const ws = list.filter(w => w.client === c.id); if (ws.length) groups.push({ c, ws }); }
  const orphan = list.filter(w => !clientOf(w));
  el.innerHTML = groups.map(({ c, ws }) => `
    <section class="cb">
      <div class="cb-h">${logoTile(c)}
        <div class="txt"><small class="cnt en">${esc(T[lang].projects(ws.length))}</small><h2>${esc(cName(c))}</h2>${field(c, 'sector', lang) ? `<small>${esc(field(c, 'sector', lang))}</small>` : ''}</div>
        <a class="more" href="#c-${esc(c.id)}">${t('clientPage')} ${I.arrow}</a>
      </div>
      <div class="row">${ws.map(card).join('')}</div>
    </section>`).join('') + (orphan.length ? `<section class="cb"><div class="cb-h"><div class="txt"><h2>${t('vGrid')}</h2></div></div><div class="row">${orphan.map(card).join('')}</div></section>` : '');
}
function renderClient(id) {
  const c = D.clients.find(x => x.id === id); if (!c) { location.hash = ''; return; }
  const ws = works().filter(w => w.client === id);
  const nb = ws.filter(w => kindOf(w) === 'build').length, nd = ws.length - nb;
  $('#clientView').innerHTML = `
    <a class="back" href="#">${I.back}${t('back')}</a>
    <section class="cp-head fade-in">${logoTile(c)}
      <div><em class="kick">CLIENT</em><h1>${esc(cName(c))}</h1>${field(c, 'sector', lang) ? `<p>${esc(field(c, 'sector', lang))}</p>` : ''}</div>
      <div class="cp-stats">${[[nb, t('build')], [nd, t('design')]].filter(x => x[0] > 0).map(([n, l]) => `<div><b>${n}</b><span>${l}</span></div>`).join('')}</div>
    </section>
    <main><div class="grid">${ws.map(card).join('')}</div></main>`;
  document.title = `${cName(c)} | ${t('brand')}`;
}

/* ---------------- viewer ---------------- */
let V = { list: [], i: 0, m: [], mi: 0 };
function openProject(id) {
  const cid = lastList.startsWith('#c-') ? decodeURIComponent(lastList.slice(3)) : null;
  const ctx = cid ? works().filter(w => w.client === cid) : filtered();
  const list = ctx.some(w => w.id === id) ? ctx : works();
  const i = list.findIndex(w => w.id === id); if (i < 0) { location.hash = ''; return; }
  V = { list, i, m: media(list[i]), mi: 0 };
  drawViewer();
  $('#vw').classList.add('open'); $('#vw').setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
}
function closeViewer() {
  $('#vw').classList.remove('open'); $('#vw').setAttribute('aria-hidden', 'true');
  document.body.style.overflow = ''; $('#vMedia').querySelector('video')?.pause();
}
function drawMedia() {
  const m = V.m[V.mi], box = $('#vMedia');
  let h = '';
  if (m.type === 'video') h = `<video src="${esc(m.src)}" poster="${esc(m.poster)}" controls autoplay muted playsinline loop></video>`;
  else if (m.type === 'compare') h = `<div class="cmp" style="--p:50%"><img src="${esc(m.src)}" alt=""><div class="b"><img src="${esc(m.before)}" alt=""></div><span class="knob">⇆</span><input type="range" min="0" max="100" value="50" aria-label="${t('before')} / ${t('after')}"><span class="l">${t('before')}</span><span class="r">${t('after')}</span></div>`;
  else h = `<img src="${esc(m.src)}" alt="">`;
  if (V.m.length > 1) h += `<button class="nav-arrow prev" data-mi="-1">${I.arrow.replace('M5 12h14M13 6l6 6-6 6', 'M19 12H5M11 6l-6 6 6 6')}</button><button class="nav-arrow next" data-mi="1">${I.arrow}</button>`;
  h += `<button class="x vx" data-act="close" aria-label="${t('close')}">×</button>`;
  box.innerHTML = h;
  const r = box.querySelector('.cmp input'); if (r) r.addEventListener('input', () => r.parentElement.style.setProperty('--p', r.value + '%'));
  $('#vThumbs').innerHTML = V.m.length > 1 ? V.m.map((x, k) => `<button class="${k === V.mi ? 'on' : ''}" data-mt="${k}"><img src="${esc(x.type === 'video' ? x.poster : x.src)}" alt="">${x.type === 'video' ? `<span>▶ ${t('video')}</span>` : x.type === 'compare' ? `<span>${t('before')}/${t('after')}</span>` : ''}</button>`).join('') : '';
}
function drawViewer() {
  const w = V.list[V.i], c = clientOf(w), k = kindOf(w);
  drawMedia();
  const facts = [[t('category'), catNames(w)], [t('type'), t(k)], [t('loc'), field(w, 'area', lang)], [t('year'), w.year || '']].filter(f => f[1]);
  let btns = '';
  if (CONFIG.whatsapp) btns += `<a class="btn btn-gold" href="https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(t('msg') + field(w, 'title', lang) + '\n' + location.href)}" target="_blank" rel="noopener">${I.wa}${t('similar')}</a>`;
  btns += `<button class="btn" data-act="share">${I.link}${t('share')}</button>`;
  $('#vInfo').innerHTML = `
    <div class="info-top"><span class="bd ${k}">${t(k)}</span><button class="x" data-act="close" aria-label="${t('close')}">×</button></div>
    ${c ? `<a class="vcl" href="#c-${esc(c.id)}">${logoTile(c)}<span><small>${t('client')}</small><b>${esc(cName(c))}</b>${field(c, 'sector', lang) ? `<small>${esc(field(c, 'sector', lang))}</small>` : ''}</span></a>` : ''}
    <h2>${esc(field(w, 'title', lang))}</h2>
    ${facts.length ? `<div class="facts">${facts.map(([a, b]) => `<div><small>${a}</small><b>${esc(b)}</b></div>`).join('')}${facts.length % 2 ? '<div></div>' : ''}</div>` : ''}
    ${field(w, 'desc', lang) ? `<p class="desc">${esc(field(w, 'desc', lang))}</p>` : ''}
    <div class="btns">${btns}</div>
    ${V.list.length > 1 ? `<div class="pn"><button class="btn" data-pj="-1">${t('prev')}</button><button class="btn" data-pj="1">${t('next')}</button></div>` : ''}`;
  document.title = `${field(w, 'title', lang)} | ${t('brand')}`;
}
$('#vw').addEventListener('click', async e => {
  const b = e.target.closest('[data-act],[data-mi],[data-mt],[data-pj]');
  if (!b) return;
  if (b.dataset.act === 'close') location.hash = lastList || '';
  if (b.dataset.act === 'share') { try { await navigator.clipboard.writeText(location.href); } catch (x) {} toast(t('copied')); }
  if (b.dataset.mi) { V.mi = (V.mi + +b.dataset.mi + V.m.length) % V.m.length; drawMedia(); }
  if (b.dataset.mt) { V.mi = +b.dataset.mt; drawMedia(); }
  if (b.dataset.pj) { const n = V.list.length; V.i = (V.i + +b.dataset.pj + n) % n; history.replaceState(history.state, '', '#p-' + V.list[V.i].id); V.m = media(V.list[V.i]); V.mi = 0; drawViewer(); }
});
addEventListener('keydown', e => {
  if (!$('#vw').classList.contains('open')) return;
  if (e.key === 'Escape') $('#vw [data-act=close]').click();
  const rtl = document.documentElement.dir === 'rtl';
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { const d = (e.key === 'ArrowLeft') === rtl ? 1 : -1; if (V.m.length > 1) { V.mi = (V.mi + d + V.m.length) % V.m.length; drawMedia(); } }
});
// swipe on media
(() => { let x0 = null; const m = $('#vMedia');
  m.addEventListener('touchstart', e => { if (!e.target.closest('.cmp')) x0 = e.touches[0].clientX; }, { passive: true });
  m.addEventListener('touchend', e => { if (x0 == null || V.m.length < 2) return; const dx = e.changedTouches[0].clientX - x0; x0 = null; if (Math.abs(dx) < 40) return;
    const rtl = document.documentElement.dir === 'rtl'; V.mi = (V.mi + ((dx < 0) !== rtl ? 1 : -1) + V.m.length) % V.m.length; drawMedia(); });
})();
let tt; function toast(m) { const el = $('#toast'); el.textContent = m; el.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('on'), 2200); }

/* ---------------- routing ---------------- */
let lastList = '';
function route() {
  const h = location.hash;
  if (h.startsWith('#p-')) {
    openProject(decodeURIComponent(h.slice(3)));
    return;
  }
  closeViewer();
  if (h.startsWith('#c-')) {
    lastList = h;
    $('#listView').hidden = true; $('#clientView').hidden = false; renderClient(decodeURIComponent(h.slice(3)));
    scrollTo({ top: 0 });
  } else {
    lastList = '';
    $('#clientView').hidden = true; $('#listView').hidden = false; document.title = `${t('h1')} | ${t('brand')}`;
  }
}
addEventListener('hashchange', route);
document.addEventListener('click', e => {
  const l = e.target.closest('[data-l]'); if (l) { lang = l.dataset.l; try { localStorage.setItem('alsanad-lang', lang); } catch (x) {} renderAll(); return; }
  const c = e.target.closest('[data-cat]'); if (c) { S.cat = c.dataset.cat; renderStatic(); renderList(); return; }
  const k = e.target.closest('[data-kind]'); if (k) { S.kind = k.dataset.kind; renderStatic(); renderList(); return; }
  const v = e.target.closest('[data-view]'); if (v) { S.view = v.dataset.view; renderStatic(); renderList(); return; }
});
function renderAll() {
  renderStatic(); renderList();
  if (location.hash.startsWith('#c-')) renderClient(decodeURIComponent(location.hash.slice(3)));
  if ($('#vw').classList.contains('open')) drawViewer();
}

/* ---------------- boot ---------------- */
(async () => {
  try { const r = await fetch('../works/gallery.json', { cache: 'no-store' }); if (r.ok) { const j = await r.json(); D = { categories: j.categories || CATEGORIES, clients: j.clients || [], works: j.works || [] }; } } catch (e) {}
  D.clients.forEach(c => { c.id ||= (c.name_en || c.name || '').toLowerCase().replace(/[^a-z0-9]+/g, '-'); });
  renderAll(); route();
})();
</script>
</body>
</html>
